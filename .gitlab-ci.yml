# ==============================================================================
# Environment setup
# ==============================================================================
image: server-harbor:80/dls2/dls2-dev:22.04

# ==============================================================================
# Stages
# ==============================================================================
stages:
  - build
  - test
  - packdeploy        

# ------------------------------------------------------------------------------
# Build Stage
# ------------------------------------------------------------------------------
# Print versions of installed programmes on the docker image.
# Install all libs required by dls2 project
# Build the framework
display:versions:
  stage: build
  tags:
    - dls2
  script:
    - cmake --version
    - gcc --version
    - g++ --version

build:dls2:
  stage: build
  tags:
    - dls2
  script:

    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan gitlab.advr.iit.it >> ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
    - git clone git@gitlab.advr.iit.it:dls-lab/dls_gitlab_ci.git -b master /root/dls_gitlab_ci

    - git clone git@gitlab.advr.iit.it:dls-lab/dls_messages.git -b $CI_COMMIT_BRANCH
    - cd dls_messages
    - mkdir build && cd build
    - cmake ..
    - make -j$(nproc)
    - make install
    - cd ../..
    - git clone git@gitlab.advr.iit.it:dls-lab/robotlib.git -b $CI_COMMIT_BRANCH
    - cd robotlib
    - mkdir build && cd build
    - cmake ..
    - make -j$(nproc)
    - make install
    - cd ../..
    - git submodule update --init --recursive
    - mkdir build
    - cd build
    - cmake ..
    - make -j$(nproc)
  artifacts:
    paths:
      - build/*
      - bin/*
      - /root/dls_gitlab_ci/*
    expire_in: 3 hrs

# ------------------------------------------------------------------------------
# Test Stage
# ------------------------------------------------------------------------------
# Run the test cases that have been developed for the framework
test:dls2:
  stage: test
  dependencies:
    - build:dls2
  tags:
    - dls2
  script:
    - cd build
    - make -j$(nproc) dls2-tests
    - sudo make install -j$(nproc)
    - make test
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[exp\]/'
      when: never
    - when: always

# ------------------------------------------------------------------------------
# Pack and Deploy Stage
# ------------------------------------------------------------------------------
packdeploy:dls2:
  stage: packdeploy
  dependencies:
    - build:dls2
  tags:
    - dls2
  script:
    - cd build
    - make package
    - source /root/dls_gitlab_ci/make-json.bash token=$DLSUSER_TOKEN project=$CI_PROJECT_ID branch=$CI_COMMIT_BRANCH job=$CI_JOB_ID tag=latest release=$(lsb_release -sc) > out.json
    - 'curl -X post -H "Content-Type: application/json" -d @out.json http://server-ubuntu18:9000/hooks/deploy-apt'
  artifacts:
    paths:
      - build/*.deb
    expire_in: 1 week
  only:
    - master
