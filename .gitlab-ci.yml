# ==============================================================================
# Environment setup
# ==============================================================================
image: server-harbor:80/dls2/dls2-dev:latest

before_script:
  - cwd=$(pwd)
  - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - git config --global user.name "dlsuser"
  - git config --global user.email "dlsuser@iit.it"
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" >> ~/.ssh/config'
  - source /opt/ros/noetic/setup.bash
  - echo nproc=$(nproc)
  - cd $cwd
  - git clone git@gitlab.advr.iit.it:dls-lab/dls_messages.git
  - cd dls_messages
  - mkdir build
  - cd build
  - cmake ..
  - make -j$(nproc)
  - make install
  - cd $cwd
  - git clone git@gitlab.advr.iit.it:dls-lab/dls_param_server.git
  - cd dls_param_server
  - mkdir build
  - cd build
  - cmake ..
  - make -j$(nproc)
  - make install
  - cd $cwd
  - git clone git@gitlab.advr.iit.it:dls-lab/robotlib.git -b develop_dls2
  - cd robotlib
  - mkdir build
  - cd build
  - cmake ..
  - make -j$(nproc)
  - make install

# ==============================================================================
# Stages
# ==============================================================================
stages:
  - build
  - test
  - packdeploy        

# ------------------------------------------------------------------------------
# Build Stage
# ------------------------------------------------------------------------------
# Print versions of installed programmes on the docker image.
# Install all libs required by dls2 project
# Build the framework
display:versions:
  stage: build
  tags:
    - dls2
  script:
    - cmake --version
    - gcc --version
    - g++ --version

build:dls2:
  stage: build
  tags:
    - dls2
  script:
    - cd $cwd
    - git submodule update --init --recursive
    - mkdir build
    - cd build
    - cmake ..
    - make -j$(nproc)
  artifacts:
    paths:
      - build/*
      - bin/*
    expire_in: 3 hrs

# ------------------------------------------------------------------------------
# Test Stage
# ------------------------------------------------------------------------------
# Run the test cases that have been developed for the framework
test:dls2:
  stage: test
  dependencies:
    - build:dls2
  tags:
    - dls2
  script:
    - cd $cwd
    - cd build
    - make -j$(nproc) dls2-tests
    - make test
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[exp\]/'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'   

# ------------------------------------------------------------------------------
# Pack and Deploy Stage
# ------------------------------------------------------------------------------
packdeploy:dls2:
  stage: packdeploy
  tags:
    - dls2
  script:
    - cd $cwd
    - cd build
    - make package
    - echo $CI_JOB_ID > CI_JOB_ID
    - source /root/dls_gitlab_ci/make-json.bash token=$DLSUSER_TOKEN project=$CI_PROJECT_ID branch=$CI_COMMIT_BRANCH job=$CI_JOB_ID tag=latest release=$(lsb_release -sc) > out.json
    - 'curl -X post -H "Content-Type: application/json" -d @out.json http://server-ubuntu18:9000/hooks/deploy-apt'
  artifacts:
    paths:
      - build/*.deb
    expire_in: 1 week
  dependencies:
    - build:dls2
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[exp\]/'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'